[package]
name = "touchstone"
version = "0.1.0"
edition = "2021"
description = "An experiment registry for a fleet's setup. Every proposed change becomes a tracked experiment with a hypothesis, a run, measurements, and a verdict, keep or kill."
license = "MIT"

[lib]
name = "touchstone"
path = "src/lib.rs"

[[bin]]
name = "touchstone"
path = "src/main.rs"

[dependencies]
flighttape = { git = "https://github.com/david-engelmann/flighttape", rev = "74a83298aeb31c82e62b9fb0c613f5bc8600799e" }
