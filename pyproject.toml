[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verdictloop"
version = "0.1.0"
description = "The experiment registry: opened, resulted, and closed with a verdict"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
verdictloop = "verdictloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
